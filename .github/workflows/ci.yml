name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  NODE_VERSION: 24
  NODE_ENV: test
  # Credenciales solo válidas en la base efímera del runner.
  ADMIN_EMAIL: admin@hotel-ci.test
  ADMIN_PASSWORD: AdminCi-2026!

jobs:
  jest:
    name: Tests Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Crear .env.test
        run: |
          cat > .env.test <<EOF
          PORT=3000
          MONGODB_URI=mongodb://127.0.0.1:27017/hotel_ci?replicaSet=rs0
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_EXPIRES_IN=1d
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Ejecutar Jest
        run: npm test -- --ci --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: backend/coverage
          if-no-files-found: ignore

  newman:
    name: Colección Postman (Newman)
    runs-on: ubuntu-latest
    needs: jest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Iniciar MongoDB como replica set
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 1
          done

      - name: Instalar dependencias
        run: npm ci

      - name: Crear .env.test
        run: |
          cat > .env.test <<EOF
          PORT=3000
          MONGODB_URI=mongodb://127.0.0.1:27017/hotel_ci?replicaSet=rs0
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_EXPIRES_IN=1d
          CORS_ORIGIN=http://localhost:5173
          EOF

      - name: Crear administrador de pruebas
        run: npm run seed:admin

      - name: Iniciar API
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "La API no respondió en /health"
          cat server.log
          exit 1

      - name: Ejecutar colección con Newman
        run: |
          mkdir -p newman
          npx --yes newman@6 run postman/Hotel-Boutique-API.postman_collection.json \
            --environment postman/Hotel-Boutique-Local.postman_environment.example.json \
            --env-var "baseUrl=http://localhost:3000" \
            --env-var "adminEmail=$ADMIN_EMAIL" \
            --env-var "adminPassword=$ADMIN_PASSWORD" \
            --env-var "testReceptionPassword=Recepcion-Ci-1" \
            --env-var "rotatedReceptionPassword=Recepcion-Ci-2" \
            --env-var "managedTestPassword=Recepcion-Ci-3" \
            --reporters cli,junit \
            --reporter-junit-export newman/resultados.xml

      - name: Log de la API
        if: failure()
        run: cat server.log

      - name: Publicar resultados de Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-resultados
          path: backend/newman
          if-no-files-found: ignore
